# Arm 2 (think tool) with the self-served agent: identical to a0-vllm.yaml
# (same agent-vllm.yaml, user, judge, orchestrator, seed, prices) plus the
# think arm fields exactly as in arm-think.yaml. Comparable with the A0 runs
# on this stack (runs/a0-*), not with OpenRouter runs.
# Runs need an explicit --cap (token spend of the user simulator + judge; the
# agent is $0 per token, GPU time is metered by the serving window).
agent: agent-vllm.yaml
user: user.yaml
arm: think
# Adapted from the published think-tool retail example. Frozen treatment text.
think_instruction: |-
  You may use the think tool to reason about policy before acting.
  Review relevant policy rules, required information, and user confirmation.
  Then choose a real tool call or a response to the user.
# Frozen neutral external response if the fourth reply is still think-only.
think_cap_message: "I'm unable to choose the next action right now."
budget:
  cap_usd: 20.00
prices: prices.yaml
seed: 300
grader:
  judge: official
orchestrator:
  max_steps: 200
  max_errors: 10
  enforce_communication_protocol: false
  timeout_s: null
