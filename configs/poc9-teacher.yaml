# POC 9 teacher (writer T, the draft step of writer TS).
#
# Owner decision 2026-10-09: qwen/qwen3.5-397b-a17b through the same hosted
# OpenAI-compatible router as configs/agent.yaml and configs/user.yaml
# (litellm backend), non-thinking, temperature 0, for patches. Prices
# $0.55 / $3.50 per M input/output, context 262144 (owner-provided).
#
# provider.order: ONE endpoint slug, chosen at preflight from the model's
# endpoints listing; no fallbacks. Loading refuses the placeholder, and refuses
# a model that is the user simulator (configs/user.yaml) or tau2's judge
# (slh.runner.judge_config); ids are compared after dropping routing prefixes
# and a dated suffix.
#
# Every call goes through its own slh.budget.Meter (reserved against cap_usd at
# the price below, charged from the wire; failed attempts included) and is
# saved in full to the run's teacher-calls.jsonl (request text, response,
# pinned and reported provider, reported model id, usage, cost).
# Budget parity with writer S: the same max_tokens per call as the capped 9B
# client (slh.demo1.decide.MAX_OUTPUT_TOKENS = 4096), the same prompts and
# evidence (slh.poc9.writers).
backend: litellm
model: openrouter/qwen/qwen3.5-397b-a17b
temperature: 0.0
max_tokens: 4096
reasoning_reserve_tokens: 0
retries: 2
reasoning:
  enabled: false
provider:
  order: [alibaba]                    # pinned 2026-10-09: official endpoint, logprobs advertised, $0.39/$2.34
  allow_fallbacks: false
# Log-probs: set both to true / logprobs at preflight ONLY if the pinned
# endpoint lists logprobs in its supported parameters. Recorded per call as
# logprobs_available; nothing depends on them.
provider_advertises_logprobs: true
capture: logprobs
cap_usd: 1.50                         # teacher spend cap for one POC 9 run (owner sets)
price:                                # USD per million tokens
  input_per_mtok: 0.55
  output_per_mtok: 3.50
  cached_input_per_mtok: 0.55
  context_window: 262144
