# Pinned user-simulator model for A0.
# Source: OpenRouter models + endpoints APIs, checked 2026-10-05:
# deepseek/deepseek-v4-flash-0731 (dated snapshot). Pinned to the DeepInfra
# fp8 endpoint (endpoint tag deepinfra/fp8): $0.06 / $0.18 per M input/output,
# max output 384000.
#
# Pinned 2026-10-06 to CoreWeave fp8 (DeepInfra fp8's shared pool rate-limited the
# pilot; DeepSeek's own API retired this dated model).
# Why pin a provider: (1) the price table's bound holds only for that
# endpoint; (2) simulator consistency: about 25 providers serve this model
# at fp4/fp8/bf16 quantizations, and routing between them would change the
# simulated user from run to run.
#
# Request parity with tau2's default user simulator: temperature=0.0
# (DEFAULT_LLM_ARGS_USER) and the per-trial seed. One deliberate difference:
# an explicit max_tokens caps the reservation (the endpoint's max output would
# reserve far more per call). tau2's user simulator tolerates it: tau2's
# generate() only logs a warning when finish_reason is "length" and the
# simulator uses the returned text unchanged; such warnings land in the run's
# private/tau2.log. Check measured user output lengths and length finishes in
# the pilot before adopting this for A0.
# Reasoning is disabled (non-thinking). reasoning/provider are sent top-level
# (see agent.yaml for why not extra_body).
backend: litellm
model: openrouter/deepseek/deepseek-v4-flash-0731
temperature: 0.0
retries: 6
max_tokens: 4096
reasoning_reserve_tokens: 0
reasoning:
  enabled: false
provider:
  order: [coreweave/fp8]
  allow_fallbacks: false
