  # --cap`, from the `modal:` rates below. max_output_tokens / context_window
  # are the server's --max-model-len.
  qwen3.5-9b-vllm:
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    cached_input_per_mtok: 0.0
    max_output_tokens: 131072
    context_window: 131072
# Modal sandbox rates, read by slh/serving.py only (load_prices ignores this
# section). A window is reserved at gpu + cpu_core x CPU limit + memory_gib x
# memory limit (the sandbox's billed maximum) per second x its window, each
# rate the max of the per-second figure and the hourly figure / 3600: GPU
# window 0.000542 + 6 x 0.0000131 + 40 x 0.008/3600 = $0.00070949/s
# ($2.55416/h).
# Source: https://modal.com/pricing, read 2026-10-06 (verified by the
# coordinator): L40S $1.95/h ($0.000542/s), A100-40GB $2.10/h, CPU $0.047 per
# physical core-hour ($0.0000131/core/s), memory $0.008 per GiB-hour
# ($0.00000222/GiB/s); per-second billing. Region selection multiplies prices
# by 1.15-1.75x and non-preemptible placement by 3x: neither is used (no
# region, cloud or non-preemptible option is passed to Sandbox.create; the
# two flags below are asserted by the loader).
# image_build_allowance_usd: a stated ESTIMATE, not a published price, for any
# billable image-build compute; reserved and charged with every window.
modal:
  source: "https://modal.com/pricing, read 2026-10-06"
  gpu_per_hour:
    L40S: 1.95
    A100-40GB: 2.10
  cpu_core_per_hour: 0.047
  memory_gib_per_hour: 0.008
  # The published per-second figures are what is billed; slh/serving.py uses
  # max(per second, per hour / 3600) for each resource.
  per_second:
    gpu:
      L40S: 0.000542
    cpu_core: 0.0000131
    memory_gib: 0.00000222
  region_multiplier_applied: false
  nonpreemptible_multiplier_applied: false
  # Reserved and charged in full with every window that prepares (builds or
  # re-resolves) an image; a reservation that does not fit the cap is refused
  # before anything is built.
  image_build_allowance_usd: 0.05
  # Volumes: 1 TiB included free per modal.com/pricing (2026-10-06), so the
  # ~19 GB of weights cost $0 storage; not reserved.
