# USD per million tokens, each model's maximum output length (used for the
# pre-call reservation when no max_tokens is sent) and, where known, its
# context window (used only by preflight's per-call maximum). The meter refuses
# to call any model not listed, rejects non-finite or negative values, and
# charges max(this table's cost, the provider-reported cost) per call,
# aborting the run if a provider reports more than 1% above this table.
models:
  stub-agent:
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    cached_input_per_mtok: 0.0
  stub-user:
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    cached_input_per_mtok: 0.0
  stub-judge:                        # deterministic stand-in for tau2's judge
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    cached_input_per_mtok: 0.0
  # Source: OpenRouter endpoints API, 2026-10-05; only provider Alibaba
  # (pinned in agent.yaml). No cached-input discount assumed.
  openrouter/qwen/qwen3-8b:
    input_per_mtok: 0.117
    output_per_mtok: 0.455
    cached_input_per_mtok: 0.117
    max_output_tokens: 8192
    context_window: 131072
  # Agent for A0 (owner decision 2026-10-05, after Qwen3-8B's only provider
